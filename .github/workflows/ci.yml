name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore zStudio.slnx --locked-mode
      - name: Build Release
        run: dotnet build zStudio.slnx -c Release --no-restore
      - name: Test without game assets
        run: dotnet test --solution zStudio.slnx -c Release --no-build --max-parallel-test-modules 1
      - name: Validate the single-file package
        run: ./tools/publish.ps1
      - name: Validate RECOIL Blender round trip
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'blender-5.2.2-windows-x64.zip'
          Invoke-WebRequest 'https://download.blender.org/release/Blender5.2/blender-5.2.2-windows-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '3849D17A682CBA006075AAA3F3597ECB5C9C30EC31035B2E092C53E40679B535') { throw 'Blender archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'blender')
          $env:ZSTUDIO_BLENDER = Join-Path $env:RUNNER_TEMP 'blender/blender-5.2.2-windows-x64/blender.exe'
          $env:ZSTUDIO_BLENDER_HELPER = Join-Path $env:GITHUB_WORKSPACE 'artifacts/zStudio-win-x64/zStudio.exe'
          dotnet test tests/zStudio.Tests -c Release --no-build --filter 'FullyQualifiedName~BlenderGraphTests.InstalledBlenderRoundTrip'
