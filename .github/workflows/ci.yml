name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore zStudio.slnx --locked-mode
      - name: Build Release
        run: dotnet build zStudio.slnx -c Release --no-restore
      - name: Test without game assets
        run: dotnet test --solution zStudio.slnx -c Release --no-build --max-parallel-test-modules 1
      - name: Validate the single-file package
        run: ./tools/publish.ps1
      - name: Validate RECOIL Blender round trip
        run: |
          $env:ZSTUDIO_BLENDER_HELPER = Join-Path $env:GITHUB_WORKSPACE 'artifacts/zStudio-win-x64/zStudio.exe'
          $versions = @(
            @{ Version = '5.2.2'; Series = '5.2'; SHA256 = '3849D17A682CBA006075AAA3F3597ECB5C9C30EC31035B2E092C53E40679B535' },
            @{ Version = '5.3.0'; Series = '5.3'; SHA256 = '3AC567A63D59D9934F7B9213BFB27BA05760E1FB366F8F55C381573EC3EABFA8' }
          )
          foreach ($blender in $versions) {
            $name = "blender-$($blender.Version)-windows-x64"
            $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
            Invoke-WebRequest "https://download.blender.org/release/Blender$($blender.Series)/$name.zip" -OutFile $archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $blender.SHA256) { throw "Blender $($blender.Version) archive checksum mismatch" }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'blender')
            $env:ZSTUDIO_BLENDER = Join-Path $env:RUNNER_TEMP "blender/$name/blender.exe"
            dotnet test tests/zStudio.Tests -c Release --no-build --filter 'FullyQualifiedName~BlenderGraphTests.InstalledBlenderRoundTrip'
            if ($LASTEXITCODE -ne 0) { throw "Blender $($blender.Version) round trip failed" }
          }
